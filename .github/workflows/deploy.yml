name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Genera public/en/index.html a partir de public/index.html (ver
      # scripts/build-en.js) -- el sitio en si sigue sin build step, esto es
      # lo unico que corre antes de desplegar. La carpeta public/en/ no vive
      # en el repo (.gitignore), se genera fresca en cada deploy.
      - name: Generar la version en inglés
        run: |
          npm ci
          npm run build:en

      # El sitemap se rompio en produccion sin que nadie se enterara: los
      # comentarios del proyecto usan "--" como raya, y "--" dentro de un
      # comentario XML es ilegal (XML 1.0 §2.5). El archivo se desplego, se
      # sirvio con 200, y Google lo rechazo entero al parsearlo -- un fallo
      # invisible salvo que abras la URL a mano. minidom es el parser
      # estricto: falla con el comentario, a diferencia de un grep.
      - name: Validar el sitemap
        run: |
          python3 - <<'EOF'
          import xml.dom.minidom, xml.etree.ElementTree as ET
          xml.dom.minidom.parse('public/sitemap.xml')
          raiz = ET.parse('public/sitemap.xml').getroot()
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [e.text for e in raiz.findall('.//s:loc', ns)]
          assert raiz.tag.endswith('urlset'), 'la raiz no es <urlset>'
          assert urls, 'el sitemap no declara ninguna URL'
          print('sitemap OK: %d URLs' % len(urls))
          EOF

      - name: Deploy a Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=notmanrivera --commit-dirty=true
