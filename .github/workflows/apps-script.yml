name: Subir Apps Script de prospección

# Sube scripts/apps-script/ al proyecto de Apps Script ligado a la hoja de
# prospección cada vez que cambia en main. Reemplaza el `clasp push` a mano
# desde la Mac.
#
# Necesita el secreto CLASPRC_JSON: el contenido de ~/.clasprc.json de la Mac
# después de `clasp login` con hola@notmanrivera.com. Si se revoca el acceso
# (o se vuelve a hacer `clasp login`), hay que volver a copiarlo.
#
# ⚠️ El push reemplaza TODO el proyecto con lo que hay en la carpeta: lo que
# se edite a mano en el editor de Apps Script se pierde en el siguiente push.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apps-script/**'
  workflow_dispatch: {}

concurrency:
  group: apps-script
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para saber si cambió Resenas.gs desde el push anterior

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Todos los .gs juntos, como los ve Apps Script: un error de sintaxis
      # en cualquiera tumba todo el proyecto, incluido el envío de las 9 am.
      - name: Revisar sintaxis
        working-directory: scripts/apps-script
        run: |
          cat *.gs > /tmp/todo.js
          node --check /tmp/todo.js
          echo "Sintaxis OK"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Credenciales de clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON (ver el comentario al inicio de este archivo)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: clasp push
        working-directory: scripts/apps-script
        run: clasp push --force

      # La web app del formulario de reseñas (Resenas.gs) corre una VERSIÓN
      # fija del código, no lo último que subió el push: hay que volver a
      # desplegarla para que tome cambios. Siempre sobre el mismo despliegue
      # ("Reseñas web"), así la URL /exec que usa el sitio nunca cambia.
      # Cada despliegue crea una versión y Apps Script admite 200 por
      # proyecto, por eso solo se hace cuando cambia lo que usa la web app.
      - name: Desplegar la web app de reseñas
        working-directory: scripts/apps-script
        env:
          ANTES: ${{ github.event.before }}
          EVENTO: ${{ github.event_name }}
        run: |
          ID=$(clasp --json list-deployments | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              const d = JSON.parse(s).find(x => x.description === "Reseñas web");
              process.stdout.write(d ? d.deploymentId : "");
            });')
          if [ -n "$ID" ] && [ "$EVENTO" = "push" ] && git diff --quiet "$ANTES" HEAD -- Resenas.gs appsscript.json 2>/dev/null; then
            echo "Sin cambios en la web app de reseñas; no se redespliega."
          elif [ -n "$ID" ]; then
            clasp update-deployment "$ID" -d "Reseñas web"
          else
            clasp create-deployment -d "Reseñas web"
            ID=$(clasp --json list-deployments | node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                const d = JSON.parse(s).find(x => x.description === "Reseñas web");
                process.stdout.write(d ? d.deploymentId : "");
              });')
          fi
          echo "URL de la web app: https://script.google.com/macros/s/$ID/exec"
          echo "Web app de reseñas: https://script.google.com/macros/s/$ID/exec" >> "$GITHUB_STEP_SUMMARY"
