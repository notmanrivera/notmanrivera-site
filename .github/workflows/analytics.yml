name: Subir el script de Analytics

# Sube scripts/analytics/ a su proyecto de Apps Script (propiedad de hola@).
# Ese script lee GA4 cada mañana, llena la pestaña Analytics de la hoja de
# prospección y avisa de leads calientes. No es web app: no hay despliegue,
# basta con el push (el disparador diario corre la última versión subida).
#
# Usa el mismo secreto CLASPRC_JSON que apps-script.yml (clasp login de hola@).

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analytics/**'
  workflow_dispatch: {}

concurrency:
  group: apps-script
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar sintaxis
        run: |
          cat *.gs > /tmp/todo.js
          node --check /tmp/todo.js
          echo "Sintaxis OK"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Credenciales de clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON (ver apps-script.yml)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      # Solo la primera vez: crea el proyecto. create-script descarga los
      # archivos del proyecto vacío encima de los locales, por eso se crea en
      # una carpeta aparte y solo se trae el .clasp.json. Hay que commitear
      # ese .clasp.json (el ID sale en el resumen de esta ejecución) para que
      # la siguiente vez no cree otro.
      - name: Crear el proyecto si no existe
        run: |
          if [ -f .clasp.json ]; then exit 0; fi
          AQUI=$PWD
          mkdir -p /tmp/nuevo && cd /tmp/nuevo
          clasp create-script --type standalone --title "Analytics notmanrivera.com"
          ID=$(node -p 'require("./.clasp.json").scriptId')
          printf '{"scriptId":"%s","rootDir":"."}\n' "$ID" > "$AQUI/.clasp.json"
          echo "::notice::Proyecto nuevo: $ID. Commitea scripts/analytics/.clasp.json con este scriptId."
          echo "Proyecto nuevo, scriptId: \`$ID\` — commitear \`scripts/analytics/.clasp.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Autorizar una vez: https://script.google.com/d/$ID/edit → función instalar → Ejecutar" >> "$GITHUB_STEP_SUMMARY"

      - name: clasp push
        run: clasp push --force
