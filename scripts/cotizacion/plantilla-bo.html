<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cotización — {{cliente}}</title>
<!-- Plantilla de Bo Agency, adaptada del diseño de Aranza: fondo gris claro,
     logo "Bo.Agency" (bo/logo.png, el logo convertido en imagen para no
     depender de sus tipografías comerciales), Montserrat, rojo #a20621 y el
     listón (bo/liston.png) abajo a la izquierda. Se usa con
     "plantilla": "plantilla-bo.html" en el JSON. El contenido fluye; con
     "hojaUnica": true sale en una sola hoja larga. -->
<style>
  @font-face{font-family:Montserrat;src:url(fuentes/Montserrat.ttf) format("truetype");font-weight:100 900}
  @page{margin:0}
  :root{--rojo:#a20621;--tinta:#0d1416;--fondo:#f5f5f5}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--fondo)}
  body{
    font-family:Montserrat,sans-serif;color:var(--tinta);font-size:10pt;line-height:1.45;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .fondo{position:fixed;inset:0;background:var(--fondo);z-index:-1}
  table.hoja{width:100%;border-collapse:collapse}
  .hoja > thead td{height:40pt}
  .hoja > tfoot td{height:0}
  .hoja > tbody > tr > td{padding:0 52pt}

  .cabeza{display:flex;justify-content:space-between;align-items:flex-end}
  .logo{width:200pt;display:block}
  .doc{text-align:right;font-size:9pt;line-height:1.5}
  .doc .fecha{color:var(--rojo);font-weight:600;font-size:12pt;margin-bottom:2pt}
  .doc b{font-weight:600}

  /* Conceptos: cada fila de la tabla se ve como una sección */
  .tabla{width:100%;border-collapse:collapse;margin-top:34pt}
  .tabla thead{display:none}
  .tabla tr.item{display:flex;flex-direction:column;margin-bottom:22pt;break-inside:avoid}
  .tabla td{display:block}
  .tabla .c-u,.tabla .c-p{display:none}
  .desc b{display:block;color:var(--rojo);font-weight:600;font-size:16pt;letter-spacing:.2pt;text-transform:uppercase;margin-bottom:6pt;line-height:1.2}
  .desc em{display:block;font-style:normal;font-size:9pt;color:var(--rojo);margin:-3pt 0 6pt}
  .desc ul{margin-left:16pt;font-size:10.5pt;line-height:1.5}
  .desc ul li{margin-bottom:1pt}
  .desc ul li::marker{color:var(--tinta)}
  .desc .incl{font-weight:600;margin:6pt 0 2pt}
  td.c-i{text-align:right;color:var(--rojo);font-weight:600;font-size:14pt;margin-top:6pt}
  td.c-i::before{content:"VALOR: "}
  td.c-i::after{content:"No incluye IVA*";display:block;font-size:7.5pt;font-weight:400;margin-top:1pt}
  tr.desc-row{display:flex;justify-content:space-between;border-top:1.5pt solid var(--rojo);padding-top:10pt;margin-bottom:4pt}
  tr.desc-row td.desc{color:var(--rojo);font-weight:600;font-size:11pt;padding:0}
  tr.desc-row td.c-i{margin:0;font-size:11pt}
  tr.desc-row td.c-i::before,tr.desc-row td.c-i::after{content:none}

  .totales{margin:10pt 0 0 auto;width:240pt;font-size:10.5pt}
  .totales .fila{display:flex;justify-content:space-between;padding:3pt 0}
  .totales .total{margin-top:6pt;padding-top:8pt;border-top:1.5pt solid var(--rojo);color:var(--rojo);font-weight:700;font-size:17pt}

  /* Cierre: listón a la izquierda, condiciones en caja y contacto */
  .cierre{position:relative;margin:10pt -52pt 0;height:330pt;overflow:hidden;break-inside:avoid}
  .liston{position:absolute;left:-386pt;top:-68pt;width:860pt}
  .caja{position:absolute;left:52pt;bottom:28pt;width:300pt;background:#fff;border:3pt solid var(--rojo);border-radius:14pt;padding:12pt 14pt 12pt 26pt}
  .notas{font-size:7.6pt;line-height:1.45}
  .notas li{margin-bottom:2pt}
  .notas b{font-weight:600}
  .contacto{position:absolute;right:52pt;bottom:34pt;color:var(--rojo);font-weight:600;font-size:11pt;line-height:1.55}
</style>
</head>
<body>
  <div class="fondo"></div>
  <table class="hoja">
    <thead><tr><td></td></tr></thead>
    <tfoot><tr><td></td></tr></tfoot>
    <tbody><tr><td>

      <div class="cabeza">
        <img class="logo" src="bo/logo.png" alt="Bo.Agency">
        <div class="doc">
          <div class="fecha">{{fechaTexto}}</div>
          Folio {{folio}}<br>
          Preparada para:<br>{{atencion}}{{cliente}}<br>
          Vigencia: {{vigencia}}
        </div>
      </div>

      <table class="tabla">
        <thead><tr><th>Concepto</th><th class="c-u">{{thU}}</th><th class="c-p">{{thP}}</th><th class="c-i">{{thI}}</th></tr></thead>
        <tbody>
{{filas}}
        </tbody>
      </table>

{{opciones}}

      <div class="totales">
{{totales}}
      </div>

      <div class="cierre">
        <img class="liston" src="bo/liston.png" alt="">
        <div class="caja"><ul class="notas">
{{notas}}
        </ul></div>
        <div class="contacto">Aranza Candelas<br>(56) 6618 7335<br>contacto.boagency@gmail.com<br>@booguita_agency</div>
      </div>

    </td></tr></tbody>
  </table>
</body>
</html>
